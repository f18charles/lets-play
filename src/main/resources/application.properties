spring.application.name=lets-play

# --- Server and HTTPS ---
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEYSTORE:file:./keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=letsplay

# --- MongoDB (Spring Boot 4 uses spring.mongodb.*, not spring.data.mongodb.uri) ---
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/letsplay}
spring.data.mongodb.auto-index-creation=true

# --- JWT (no default on purpose: app refuses to start without a secret) ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# --- Admin seeded at startup (blank = no admin) ---
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- CORS and rate limiting ---
app.cors.allowed-origins=${CORS_ORIGINS:https://localhost:3000}
app.rate-limit.auth-per-minute=5
app.rate-limit.general-per-minute=120